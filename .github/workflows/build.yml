name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 接受 Android SDK 许可
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译 Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build-log.txt

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: radioapp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build-log.txt
