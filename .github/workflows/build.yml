name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 接受 Android SDK 许可
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译 Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build-log.txt

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: radioapp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 失败时保存构建日志到仓库
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git checkout -B buildlog
          git add -f build-log.txt
          git commit -m "CI failure log" || echo "no log to commit"
          git push -f origin buildlog || echo "log push failed"
