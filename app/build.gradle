apply plugin: 'com.android.application'

android {
    namespace 'com.example.radioapp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.radioapp'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
}